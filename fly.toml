# Fly.io — альтернатива Render. Том (volume) переживает редеплой.
#   fly launch --no-deploy --copy-config
#   fly volumes create timetable_data --size 1 --region fra
#   fly secrets set DJANGO_SECRET_KEY=... DJANGO_ALLOWED_HOSTS=<app>.fly.dev \
#                   DJANGO_CSRF_TRUSTED_ORIGINS=https://<app>.fly.dev
#   fly deploy
app = "edville-timetable"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  DJANGO_DEBUG = "False"
  DJANGO_DB_PATH = "/app/data/db.sqlite3"
  PORT = "8000"

[mounts]
  source = "timetable_data"
  destination = "/app/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1
