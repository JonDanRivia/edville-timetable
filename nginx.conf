# Замени YOUR_DOMAIN на свой реальный домен, например timetable.iss-astana.kz

server {
    listen 80;
    server_name YOUR_DOMAIN;

    # Путь для проверки Let's Encrypt (сертификат получаем через certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Пока нет сертификата — редиректим всё на HTTPS не нужно, certbot сам допишет этот блок.
    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /app/staticfiles/;
    }
}

# После первого успешного запуска certbot (см. README) — раскомментировать блок ниже
