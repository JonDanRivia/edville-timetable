{% extends "base.html" %}
{% block title %}Расписание школы{% endblock %}
{% block content %}
<div class="ribbon-hero">
  <div class="ribbon-title">Расписание уроков</div>
  <div class="ribbon-subtitle">Выберите класс или учителя, чтобы посмотреть расписание</div>
</div>

<div class="card">
  <div class="selector-row">
    <div class="selector-group">
      <label for="select-class">Класс</label>
      <select id="select-class" onchange="if (this.value) { window.location.href = this.value; }">
        <option value="">— выбрать —</option>
        {% for c in classes %}
          <option value="{{ c.get_absolute_url }}">{{ c.name }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="selector-group">
      <label for="select-teacher">Учитель</label>
      <input type="search" id="search-teacher" class="selector-search"
             placeholder="Начните вводить фамилию…" autocomplete="off"
             aria-controls="select-teacher">
      <select id="select-teacher" size="1" onchange="if (this.value) { window.location.href = this.value; }">
        <option value="">— выбрать —</option>
        {% for t in teachers %}
          <option value="{{ t.get_absolute_url }}">{{ t.full_name }}</option>
        {% endfor %}
      </select>
      <div class="selector-hint" id="teacher-count"></div>
    </div>
  </div>
</div>

{% if not has_any_class %}
  <div class="card">
    <p class="subtitle">Классы ещё не добавлены. Добавь их через <a href="/admin/schedule/schoolclass/">админку</a>.</p>
  </div>
{% endif %}
{% endblock %}
